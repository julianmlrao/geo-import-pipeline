# Overlay: web UI, tile/feature servers and Caddy (HTTPS). Use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
x-log: &log
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    ports: !reset []
  importer:
    environment:
      GEO_IMPORT_RUN_ON_START: "1"
      GEO_IMPORT_TRIGGER_TOKEN: ${GEO_IMPORT_TRIGGER_TOKEN:?set GEO_IMPORT_TRIGGER_TOKEN}

  web:
    build: .
    entrypoint: ["uvicorn", "geo_import.web.app:app", "--host", "0.0.0.0", "--port", "8000",
                 "--proxy-headers", "--forwarded-allow-ips", "*"]
    command: []
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-geo}
      GEO_READER_PASSWORD: ${GEO_READER_PASSWORD:-reader}
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      GEO_IMPORT_TRIGGER_TOKEN: ${GEO_IMPORT_TRIGGER_TOKEN}
      TRIGGER_URL: http://importer:8099
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: "1"
      WEB_VENDOR_DIR: /app/site/vendor
    volumes:
      - ./config/sources:/app/config/sources:ro
    logging:
      <<: *log

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://geo_reader:${GEO_READER_PASSWORD:-reader}@db/${POSTGRES_DB:-geo}
      TS_BASEPATH: /tiles
    profiles: !reset []
    ports: !reset []
    logging:
      <<: *log

  pg_featureserv:
    image: pramsey/pg_featureserv:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://geo_reader:${GEO_READER_PASSWORD:-reader}@db/${POSTGRES_DB:-geo}
      PGFS_SERVER_BASEPATH: /api
      PGFS_SERVER_HTTPHOST: 0.0.0.0
      PGFS_DATABASE_TABLEINCLUDES: geo_import.features,geo_import.metadata
    logging:
      <<: *log

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      <<: *log

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-geo_import}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-geo}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f /backups/geo-$$(date +%F).dump && find /backups -name 'geo-*.dump' -mtime +7 -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    logging:
      <<: *log

volumes:
  caddy_data:
  caddy_config:
  backups:
