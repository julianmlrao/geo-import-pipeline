name: pages
on:
  push: { branches: [main], paths: ["site/**", "scripts/build_site.py"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Build legal pages and landing page
        env:
          SITE_MODE: pages
          IMPRESSUM_NAME: ${{ vars.IMPRESSUM_NAME }}
          IMPRESSUM_ANSCHRIFT: ${{ vars.IMPRESSUM_ANSCHRIFT }}
          IMPRESSUM_VERTRETEN: ${{ vars.IMPRESSUM_VERTRETEN }}
          IMPRESSUM_EMAIL: ${{ vars.IMPRESSUM_EMAIL }}
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
