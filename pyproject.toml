[project]
name = "geo-import-pipeline"
version = "0.1.0"
description = "Configurable import pipeline for WFS and CSV geodata into PostgreSQL/PostGIS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "requests>=2.32",
  "lxml>=5",
  "shapely>=2.0",
  "pyproj>=3.6",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "apscheduler>=3.10,<4",
]

[project.scripts]
geo-import = "geo_import.cli:app"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "markdown>=3.6", "python-multipart>=0.0.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
    "pip-licenses>=5",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_import"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["shapely.*", "pyproj.*", "lxml.*", "apscheduler.*", "markdown.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostGIS database (GEO_IMPORT_TEST_DSN)"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
